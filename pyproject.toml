[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoflow"
dynamic = ["version"]
description = "GEE-like Earth Observation, GIS, Spatial Statistics, Research Design and Geospatial ML Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "GeoFlow Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "shapely>=2.0.0",
    "geopandas>=1.0.0",
    "rasterio>=1.3.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "pyproj>=3.6.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.3.0",
    "requests>=2.31.0",
    "click>=8.1.0",
    "h5py>=3.8.0",
    "pillow>=9.0",
]

[project.optional-dependencies]
earthdata = [
    "earthaccess>=0.11.0",
]
viz = [
    "folium>=0.15.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
]
stats = [
    "libpysal>=4.9.0",
    "esda>=2.5.0",
    "statsmodels>=0.14.0",
]
stac = [
    "pystac-client>=0.7.0",
    "odc-stac>=0.3.9",
    "planetary-computer>=1.0.0",
    "xarray>=2023.1.0",
]
docs = [
    "mkdocs-material>=9.5",
]
notebook = [
    "ipywidgets>=7.6",
    "ipython>=7.0",
]
ml = [
    "scikit-learn>=1.3.0",
    "torch>=2.1.0",
]
all = [
    "geoflow[viz,stats,ml,stac,notebook]",
]

[project.scripts]
geoflow = "geoflow.cli.main:cli"

[tool.setuptools.dynamic]
version = { attr = "geoflow.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["geoflow*"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
markers = [
    "network: test needs internet access to NASA / STAC services (deselect with -m 'not network')",
]
